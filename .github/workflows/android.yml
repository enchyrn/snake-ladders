name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
      - main

# NDK version pinned explicitly (not "latest") so a fresh NDK release can't
# silently change codegen/ABI behavior underneath the Rust cross-compile and
# break this build without anyone touching this file.
env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        # `tauri android build` cross-compiles the Rust side (see
        # src-tauri/Cargo.toml's cdylib target) for each Android ABI, and
        # cargo-ndk/tauri's Android build tooling locates the toolchain via
        # NDK_HOME rather than discovering it on its own.
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Drop-in for actions/setup-node: the pinned nub, the Node from
      # .node-version, and nub's store cached on nub.lock (ADR 0017). It also
      # fronts that Node's bin dir on PATH, which is where tauri's
      # beforeBuildCommand finds the toolchain it shells out to.
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.1

      - run: nub ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # src-tauri/Cargo.toml declares its own [workspace] (see comment
          # there), separate from the root Cargo.toml workspace, so it needs
          # its own cache keyed on its own lockfile/target dir.
          workspaces: "src-tauri -> target"

      - name: Generate Android project
        run: nubx tauri android init --ci

      - name: Patch generated manifest for LAN networking
        # tauri android init regenerates gen/android from scratch every time,
        # so the INTERNET/multicast permissions and cleartext-traffic flag
        # documented in src-tauri/mobile/README.md must be re-applied after
        # every init, not just once. See scripts/patch-android-manifest.mjs.
        run: node scripts/patch-android-manifest.mjs

      - run: nubx tauri android build --debug --apk

      - name: List built APKs
        # Diagnoses a failed upload-artifact glob from the log instead of
        # leaving "no files found" a mystery.
        run: find src-tauri/gen/android -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
