name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
      - main

# NDK version pinned explicitly (not "latest") so a fresh NDK release can't
# silently change codegen/ABI behavior underneath the Rust cross-compile and
# break this build without anyone touching this file.
env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list is "tools platform-tools", and
          # `tools` no longer exists in the SDK repository — sdkmanager fails
          # the whole job on it before anything of ours has run. Nothing here
          # used it: the NDK is installed explicitly below and the Gradle
          # build wants platform-tools.
          packages: platform-tools

      - name: Install Android NDK
        # `tauri android build` cross-compiles the Rust side (see
        # src-tauri/Cargo.toml's cdylib target) for each Android ABI, and
        # cargo-ndk/tauri's Android build tooling locates the toolchain via
        # NDK_HOME rather than discovering it on its own.
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Drop-in for actions/setup-node: the pinned nub, the Node from
      # .node-version, and nub's store cached on nub.lock (ADR 0017). It also
      # fronts that Node's bin dir on PATH, which is where tauri's
      # beforeBuildCommand finds the toolchain it shells out to.
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.1

      - run: nub ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # src-tauri/Cargo.toml declares its own [workspace] (see comment
          # there), separate from the root Cargo.toml workspace, so it needs
          # its own cache keyed on its own lockfile/target dir.
          workspaces: "src-tauri -> target"

      - name: Generate Android project
        # npx, not nubx, and this is the one place npm survives the migration.
        # The Tauri CLI bakes the command Gradle will use to re-invoke it into
        # the generated BuildTask.kt, deriving it from argv[1] and npm_execpath.
        # It knows npm/npx/pnpm/yarn/bun and does not know nub: under nubx
        # npm_execpath is unset, so it writes a path-relative `node <path>` that
        # Gradle then runs from src-tauri, where the path does not resolve. See
        # ADR 0017; run 34761512711 is the failure.
        run: nubx nx run tauri:android-init

      # npx for the same reason as the init step above. The Gradle re-invocation
      # is baked in at init time and must match how the CLI is launched here.
      - run: nubx nx run tauri:android-build

      - name: List built APKs
        # Diagnoses a failed upload-artifact glob from the log instead of
        # leaving "no files found" a mystery.
        run: find src-tauri/gen/android -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
