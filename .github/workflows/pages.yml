name: Pages

on:
  # A project site has exactly one live deployment, so only the default
  # branch publishes automatically — deploying every `claude/**` branch the
  # way android.yml builds them would leave whichever pushed last serving as
  # "the" app. workflow_dispatch is how a branch gets published deliberately.
  workflow_dispatch:
  push:
    branches:
      - main
      # TEMPORARY: proving the first deployment from the branch that adds it,
      # because workflow_dispatch only registers for workflows already on the
      # default branch. Remove once the URL has been seen serving the app.
      - claude/snake-ladders-cross-device-3uu177

# GITHUB_TOKEN defaults to read-only; deploy-pages needs to write the Pages
# deployment and mint an OIDC token to prove the artifact came from this run.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages rejects a deployment that starts while another is in flight. Queue
# rather than cancel: cancelling the in-progress run can leave the site on
# the older build even though the newer commit reported success.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The migration's runtime floor. CI's web job still pins 22 until
          # the Nx/Nub work replaces both bootstraps.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build for the Pages subpath
        # A project site is served from https://<owner>.github.io/<repo>/,
        # never the origin root. Taking the prefix from the repository name
        # rather than hardcoding it means a rename cannot leave the manifest,
        # the service worker and the asset URLs pointing at a path that no
        # longer exists. (A user/org site — a repository literally named
        # <owner>.github.io — is served from the root and would need "/".)
        env:
          PUBLIC_BASE_PATH: ${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
