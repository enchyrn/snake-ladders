name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Drop-in for actions/setup-node. It installs the pinned nub, provisions
      # the Node in .node-version, and caches nub's store keyed on nub.lock.
      # npm is not a supported interface here any more — see ADR 0017.
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.1

      - run: nub ci

      # `lint` is the boundary rule, and it reads the whole graph rather than
      # one project's files, so it runs across every project rather than being
      # scoped like the rest.
      - run: nub run lint

      # Not scoped to game-web: its tsconfig includes only main.tsx and
      # vite.config.ts, so a scoped typecheck covers no test file at all and a
      # type error in a test reaches nobody — vitest transpiles without
      # checking. Every project's typecheck runs, and the whole suite with it.
      - run: nubx nx run-many -t typecheck,test,build

  rust:
    name: Rust (lan-sync)
    runs-on: ubuntu-latest
    # This job intentionally covers only crates/lan-sync (the root workspace),
    # not src-tauri. src-tauri is its own cargo workspace and building it
    # requires the platform webview toolchain (webkit2gtk, etc.) plus, for
    # mobile targets, the Android NDK/SDK — that's handled by android.yml
    # instead, which builds the full app. Keeping this job to lan-sync means
    # feedback on every push/PR without the platform webview toolchain.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Root Cargo.toml's workspace is "." (members = ["crates/*"]).
          workspaces: "."

      # The cargo checks are invoked through Nx targets, so this job needs the
      # JS toolchain even though it compiles no JavaScript: nubx ships with
      # nub, and nx resolves out of node_modules.
      - uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.9.1

      - run: nub ci

      - run: nubx nx run native:cargo-fmt

      - run: nubx nx run native:cargo-clippy

      - run: nubx nx run native:cargo-test
